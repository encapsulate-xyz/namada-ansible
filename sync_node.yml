---
- name: Sync node
  hosts: all
  become: true
  gather_facts: true
  vars:
    allowed_node_types: [validator, fullnode]
  vars_files:
    - group_vars/all.yml
    - group_vars/{{ env }}.yml

  pre_tasks:
    - name: Setup environment and dependencies
      when: type in allowed_node_types
      block:
        - name: Include environment setup tasks
          ansible.builtin.include_tasks: tasks/setup_environment.yml

  tasks:
    - name: Run sync playbook
      when: type in allowed_node_types
      block:
        - name: Include common handlers
          ansible.builtin.include_role:
            name: common
        - name: Include sync role
          ansible.builtin.include_role:
            name: sync
            public: true

  post_tasks:
    - name: Verify node
      when: type in allowed_node_types
      block:
        - name: Include verify service task
          ansible.builtin.include_tasks: tasks/verify_service.yml
          vars:
            # same path as node_log_file_path in the node role
            log_file_path: "{{ sync_home_dir }}/log/{{ service_identifier }}.log"
            health_url: "http://localhost:{{ namada[type].ports.rpc_port }}/health"
